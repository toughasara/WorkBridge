services:
  db:
    container_name: postgres_container_2
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root_password
      POSTGRES_DB: WorkBridge_db
    volumes:
      - db_data_2:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - laravel_network_2

  pgadmin:
    container_name: pgadmin4_container_v2_2
    image: dpage/pgadmin4:9.0
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: gangdb@admin.com
      PGADMIN_DEFAULT_PASSWORD: root_password
    ports:
      - "8083:80"
    networks:
      - laravel_network_2

  app:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: laravel_app_2
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./project:/var/www/html
    ports:
      - "8001:80"
    depends_on:
      - db
    networks:
      - laravel_network_2

volumes:
  db_data_2:

networks:
  laravel_network_2: